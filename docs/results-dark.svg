<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 393" width="760" height="393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Claude copies 94–96% of real values exactly. Fewer reach the clock"><title>Claude copies 94–96% of real values exactly. Fewer reach the clock</title><text x="24" y="32" font-size="17" font-weight="700" fill="#f0efec">Claude copies 94–96% of real values exactly. Fewer reach the clock</text><text x="24" y="54" font-size="13" fill="#c3c2b7">What the code cannot verify is withheld, so the gap is missing values, not wrong ones</text><rect x="24" y="72" width="12" height="12" rx="2" fill="#3987e5"/><text x="42" y="82" font-size="12" fill="#f0efec">Reached the clock correctly</text><rect x="222" y="72" width="12" height="12" rx="2" fill="#4a4945"/><text x="240" y="82" font-size="12" fill="#f0efec">Missing or unchecked</text><rect x="390" y="72" width="12" height="12" rx="2" fill="#d03b3b"/><text x="408" y="82" font-size="12" fill="#f0efec">Scored wrong</text><line x1="518" x2="518" y1="70" y2="85" stroke="#f0efec" stroke-width="2"/><text x="526" y="82" font-size="12" fill="#f0efec">Values copied exactly</text><text x="724" y="114" font-size="11.5" text-anchor="end" fill="#c3c2b7">Copied</text><text x="24" y="141" font-size="13" font-weight="600" fill="#f0efec">20 synthetic reports</text><text x="24" y="157" font-size="11.5" fill="#c3c2b7">Claude Haiku 5.5</text><rect x="220" y="128" width="440" height="30" rx="4" fill="#4a4945"/><rect x="220" y="128" width="440.0" height="30" rx="4" fill="#3987e5"/><text x="230" y="148" font-size="13" font-weight="600" fill="#ffffff">100%</text><line x1="660.0" x2="660.0" y1="123" y2="163" stroke="#f0efec" stroke-width="2"/><text x="724" y="148" font-size="13" text-anchor="end" fill="#f0efec">100%</text><text x="24" y="195" font-size="13" font-weight="600" fill="#f0efec">39 real reports</text><text x="24" y="211" font-size="11.5" fill="#c3c2b7">Claude Haiku 5.5</text><rect x="220" y="182" width="440" height="30" rx="4" fill="#4a4945"/><rect x="220" y="182" width="343.6" height="30" rx="4" fill="#3987e5"/><rect x="565.6" y="182" width="3.0" height="30" fill="#d03b3b"/><text x="230" y="202" font-size="13" font-weight="600" fill="#ffffff">78%</text><text x="576.6" y="202" font-size="12" fill="#f0efec">21%</text><line x1="640.3" x2="640.3" y1="177" y2="217" stroke="#f0efec" stroke-width="2"/><text x="724" y="202" font-size="13" text-anchor="end" fill="#f0efec">96%</text><text x="24" y="249" font-size="13" font-weight="600" fill="#f0efec">39 real reports</text><text x="24" y="265" font-size="11.5" fill="#c3c2b7">Claude Opus 5.5</text><rect x="220" y="236" width="440" height="30" rx="4" fill="#4a4945"/><rect x="220" y="236" width="351.6" height="30" rx="4" fill="#3987e5"/><rect x="573.6" y="236" width="3.0" height="30" fill="#d03b3b"/><text x="230" y="256" font-size="13" font-weight="600" fill="#ffffff">80%</text><text x="584.6" y="256" font-size="12" fill="#f0efec">19%</text><line x1="636.4" x2="636.4" y1="231" y2="271" stroke="#f0efec" stroke-width="2"/><text x="724" y="256" font-size="13" text-anchor="end" fill="#f0efec">95%</text><text x="24" y="303" font-size="13" font-weight="600" fill="#f0efec">142 held-out real reports</text><text x="24" y="319" font-size="11.5" fill="#c3c2b7">Claude Haiku 5.5</text><rect x="220" y="290" width="440" height="30" rx="4" fill="#4a4945"/><rect x="220" y="290" width="297.8" height="30" rx="4" fill="#3987e5"/><rect x="519.8" y="290" width="3.0" height="30" fill="#d03b3b"/><text x="230" y="310" font-size="13" font-weight="600" fill="#ffffff">68%</text><text x="530.8" y="310" font-size="12" fill="#f0efec">32%</text><line x1="634.5" x2="634.5" y1="285" y2="325" stroke="#f0efec" stroke-width="2"/><text x="724" y="310" font-size="13" text-anchor="end" fill="#f0efec">94%</text><text x="24" y="354" font-size="11.5" fill="#c3c2b7">Red: 9 inputs scored wrong. Checked against the report images, each time the pipeline was right</text><text x="24" y="371" font-size="11.5" fill="#c3c2b7">and the dataset's label was not. Shares of labelled markers, three runs per set; real reports from MedRepBench.</text></svg>
