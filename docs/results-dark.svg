<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Claude copies 94–96% of printed numbers exactly. Fewer reach the clock"><title>Claude copies 94–96% of printed numbers exactly. Fewer reach the clock</title><text x="24" y="32" font-size="17" font-weight="700" fill="#f0efec">Claude copies 94–96% of printed numbers exactly. Fewer reach the clock</text><text x="24" y="54" font-size="13" fill="#c3c2b7">With the current code, what cannot be verified is withheld, so the gap is missing values, not wrong ones</text><rect x="24" y="72" width="12" height="12" rx="2" fill="#3987e5"/><text x="42" y="82" font-size="12" fill="#f0efec">Reached the clock correctly</text><rect x="222" y="72" width="12" height="12" rx="2" fill="#4a4945"/><text x="240" y="82" font-size="12" fill="#f0efec">Missing, a limit or unchecked</text><rect x="436" y="72" width="12" height="12" rx="2" fill="#d03b3b"/><text x="454" y="82" font-size="12" fill="#f0efec">Scored wrong</text><line x1="564" x2="564" y1="70" y2="85" stroke="#f0efec" stroke-width="2"/><text x="572" y="82" font-size="12" fill="#f0efec">Numbers copied</text><text x="724" y="114" font-size="11.5" text-anchor="end" fill="#c3c2b7">Numbers copied</text><text x="24" y="141" font-size="13" font-weight="600" fill="#f0efec">39 real reports</text><text x="24" y="157" font-size="11.5" fill="#c3c2b7">Claude Haiku 5.5</text><rect x="220" y="128" width="440" height="30" rx="4" fill="#4a4945"/><rect x="220" y="128" width="340.5" height="30" rx="4" fill="#3987e5"/><rect x="562.5" y="128" width="3.0" height="30" fill="#d03b3b"/><text x="230" y="148" font-size="13" font-weight="600" fill="#ffffff">77%</text><text x="573.6" y="148" font-size="12" fill="#f0efec">22%</text><line x1="640.3" x2="640.3" y1="123" y2="163" stroke="#f0efec" stroke-width="2"/><text x="724" y="148" font-size="13" text-anchor="end" fill="#f0efec">96%</text><text x="24" y="195" font-size="13" font-weight="600" fill="#f0efec">39 real reports</text><text x="24" y="211" font-size="11.5" fill="#c3c2b7">Claude Opus 5.5</text><rect x="220" y="182" width="440" height="30" rx="4" fill="#4a4945"/><rect x="220" y="182" width="348.6" height="30" rx="4" fill="#3987e5"/><rect x="570.6" y="182" width="3.0" height="30" fill="#d03b3b"/><text x="230" y="202" font-size="13" font-weight="600" fill="#ffffff">79%</text><text x="581.6" y="202" font-size="12" fill="#f0efec">20%</text><line x1="636.4" x2="636.4" y1="177" y2="217" stroke="#f0efec" stroke-width="2"/><text x="724" y="202" font-size="13" text-anchor="end" fill="#f0efec">95%</text><text x="24" y="249" font-size="13" font-weight="600" fill="#f0efec">142 held-out reports</text><text x="24" y="265" font-size="11.5" fill="#c3c2b7">Haiku 5.5, after 4 fixes from them</text><rect x="220" y="236" width="440" height="30" rx="4" fill="#4a4945"/><rect x="220" y="236" width="301.8" height="30" rx="4" fill="#3987e5"/><rect x="523.8" y="236" width="3.0" height="30" fill="#d03b3b"/><text x="230" y="256" font-size="13" font-weight="600" fill="#ffffff">69%</text><text x="534.8" y="256" font-size="12" fill="#f0efec">31%</text><line x1="634.5" x2="634.5" y1="231" y2="271" stroke="#f0efec" stroke-width="2"/><text x="724" y="256" font-size="13" text-anchor="end" fill="#f0efec">94%</text><text x="24" y="300" font-size="11.5" fill="#c3c2b7">Bars: shares of the markers labelled with a blood value, three runs per set; real reports from MedRepBench.</text><text x="24" y="317" font-size="11.5" fill="#c3c2b7">Numbers copied: printed numbers the model copied exactly, leaving out text results such as Negative.</text><text x="24" y="334" font-size="11.5" fill="#c3c2b7">Red: 9 inputs scored wrong. Checked against the report images, each time the label was wrong.</text></svg>
