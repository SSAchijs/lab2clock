[project]
name = "lab2clock"
version = "0.1.0"
description = "Lab report in, clock inputs out"
readme = "README.md"
authors = [
    { name = "Sebastian van der Chijs", email = "123059409+SSAchijs@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
clock = [
    "pyaging>=0.5.7",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
