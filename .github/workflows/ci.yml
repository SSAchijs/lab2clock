name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked

      - run: uv run ruff check

      - run: uv run pytest
